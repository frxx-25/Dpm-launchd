name: Build Custom Dopamine
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos & Dependencies
        run: |
          bash -c "$(curl -fsSL https://githubusercontent.com)"
          echo "THEOS=/Users/runner/theos" >> $GITHUB_ENV

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Build Application Payload
        run: |
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          
      - name: Upload Finished App Binary
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Auto-Dopamine
          path: "*.ipa"
